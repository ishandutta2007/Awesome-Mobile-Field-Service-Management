<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="45%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#020617"/></linearGradient><linearGradient id="primary-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accent-cyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".8"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1);opacity:.25}50%{transform:scale(1.15);opacity:.45}}@keyframes floatSignal{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes dashCycle{0%{stroke-dashoffset:0}}.bg{fill:url(#bg-grad)}.grid{stroke:rgba(255,255,255,.04);stroke-width:1}.badge-text,.subtitle,.title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:42px;fill:#fff;letter-spacing:-.5px}.subtitle{font-weight:400;font-size:19px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#38bdf8}.pulsing-orb-1{transform-origin:1050px 90px;animation:pulseOrb 6s ease-in-out infinite}.pulsing-orb-2{transform-origin:150px 280px;animation:pulseOrb 7s ease-in-out infinite}.floating-circuit{animation:floatSignal 5s ease-in-out infinite}.dispatch-line{stroke-dasharray:6 6;animation:dashCycle 2s linear infinite}</style><rect width="1200" height="360" class="bg" rx="16"/><g class="grid"><line x1="100" x2="100" y1="0" y2="360"/><line x1="200" x2="200" y1="0" y2="360"/><line x1="300" x2="300" y1="0" y2="360"/><line x1="400" x2="400" y1="0" y2="360"/><line x1="500" x2="500" y1="0" y2="360"/><line x1="600" x2="600" y1="0" y2="360"/><line x1="700" x2="700" y1="0" y2="360"/><line x1="800" x2="800" y1="0" y2="360"/><line x1="900" x2="900" y1="0" y2="360"/><line x1="1000" x2="1000" y1="0" y2="360"/><line x1="1100" x2="1100" y1="0" y2="360"/><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="300" y2="300"/></g><circle cx="1050" cy="90" r="140" fill="#3b82f6" class="pulsing-orb-1" filter="url(#glow)"/><circle cx="150" cy="280" r="120" fill="#8b5cf6" class="pulsing-orb-2" filter="url(#glow)"/><g class="floating-circuit" transform="translate(860, 60)"><rect width="180" height="210" x="70" y="40" fill="#1e293b" stroke="#38bdf8" stroke-width="2" opacity=".9" rx="16"/><rect width="150" height="150" x="85" y="60" fill="#0f172a" rx="8"/><circle cx="160" cy="230" r="5" fill="#38bdf8"/><path fill="none" stroke="#38bdf8" stroke-width="3" d="M 100 150 Q 130 90 170 120 T 215 95" class="dispatch-line"/><circle cx="100" cy="150" r="4" fill="#10b981"/><circle cx="215" cy="95" r="5" fill="#f43f5e"/><circle cx="215" cy="95" r="12" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity=".6"><animate attributeName="r" dur="2s" repeatCount="indefinite" values="6;22"/><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.8;0"/></circle><g transform="translate(0, 30)"><rect width="95" height="42" x="0" y="0" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" opacity=".95" rx="8"/><text x="12" y="18" fill="#a5b4fc" font-family="sans-serif" font-size="10">DISPATCH</text><text x="12" y="32" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">99.8% Sync</text></g><g transform="translate(190, 160)"><rect width="90" height="42" x="0" y="0" fill="#064e3b" stroke="#10b981" stroke-width="1.5" opacity=".95" rx="8"/><text x="10" y="18" fill="#6ee7b7" font-family="sans-serif" font-size="10">OFFLINE</text><text x="10" y="32" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">Active 🟢</text></g></g><g transform="translate(80, 0)"><rect width="260" height="30" x="0" y="62" fill="#0369a1" fill-opacity=".3" stroke="#0284c7" stroke-width="1" rx="15"/><circle cx="16" cy="77" r="4" fill="#38bdf8"/><text x="28" y="82" class="badge-text">ENTERPRISE &amp; FIELD OPERATIONS</text><text x="0" y="145" class="title">Awesome Mobile Field Service</text><text x="0" y="195" fill="url(#primary-grad)" class="title">Management (FSM)</text><text x="0" y="245" class="subtitle">Curated ecosystem of SaaS solutions &amp; open-source projects for mobile dispatch,</text><text x="0" y="272" class="subtitle">work-order tracking, offline-first technician workflows, and field analytics.</text></g></svg>