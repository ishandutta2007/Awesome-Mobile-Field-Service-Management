<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bg-grad); }
    .grid { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    
    /* Dynamic pulsing & floating background elements safely behind text */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.15); opacity: 0.45; }
    }
    @keyframes floatSignal {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes dashCycle {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 60; }
    }
    
    .pulsing-orb-1 {
      transform-origin: 1050px 90px;
      animation: pulseOrb 6s ease-in-out infinite;
    }
    .pulsing-orb-2 {
      transform-origin: 150px 280px;
      animation: pulseOrb 7s ease-in-out infinite;
    }
    .floating-circuit {
      animation: floatSignal 5s ease-in-out infinite;
    }
    .dispatch-line {
      stroke-dasharray: 6 6;
      animation: dashCycle 2s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" class="bg" />

  <!-- Grid Pattern -->
  <g class="grid">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="1100" y1="0" x2="1100" y2="360" />
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Dynamic Background Glow Orbs -->
  <circle cx="1050" cy="90" r="140" fill="#3b82f6" filter="url(#glow)" class="pulsing-orb-1" />
  <circle cx="150" cy="280" r="120" fill="#8b5cf6" filter="url(#glow)" class="pulsing-orb-2" />

  <!-- Animated Tech Field Connectivity Graphics (Kept to the right) -->
  <g class="floating-circuit" transform="translate(860, 60)">
    <!-- Mobile Tablet Frame -->
    <rect x="70" y="40" width="180" height="210" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2" opacity="0.9" />
    <rect x="85" y="60" width="150" height="150" rx="8" fill="#0f172a" />
    <circle cx="160" cy="230" r="5" fill="#38bdf8" />
    
    <!-- Mini Map & Route on screen -->
    <path d="M 100 150 Q 130 90 170 120 T 215 95" fill="none" stroke="#38bdf8" stroke-width="3" class="dispatch-line" />
    <circle cx="100" cy="150" r="4" fill="#10b981" />
    <circle cx="215" cy="95" r="5" fill="#f43f5e" />
    
    <!-- Ping Radar Wave -->
    <circle cx="215" cy="95" r="12" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="6;22" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite" />
    </circle>

    <!-- Floating Metric Cards -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="95" height="42" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" opacity="0.95" />
      <text x="12" y="18" font-family="sans-serif" font-size="10" fill="#a5b4fc">DISPATCH</text>
      <text x="12" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">99.8% Sync</text>
    </g>

    <g transform="translate(190, 160)">
      <rect x="0" y="0" width="90" height="42" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" opacity="0.95" />
      <text x="10" y="18" font-family="sans-serif" font-size="10" fill="#6ee7b7">OFFLINE</text>
      <text x="10" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Active 🟢</text>
    </g>
  </g>

  <!-- Foreground Title and Content -->
  <g transform="translate(80, 0)">
    <!-- Category Pill -->
    <rect x="0" y="62" width="260" height="30" rx="15" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1" />
    <circle cx="16" cy="77" r="4" fill="#38bdf8" />
    <text x="28" y="82" class="badge-text">ENTERPRISE &amp; FIELD OPERATIONS</text>

    <!-- Main Title -->
    <text x="0" y="145" class="title">
      Awesome Mobile Field Service
    </text>
    <text x="0" y="195" class="title" fill="url(#primary-grad)">
      Management (FSM) 🛠️
    </text>

    <!-- Subtitle -->
    <text x="0" y="245" class="subtitle">
      Curated ecosystem of SaaS solutions &amp; open-source projects for mobile dispatch,
    </text>
    <text x="0" y="272" class="subtitle">
      work-order tracking, offline-first technician workflows, and field analytics.
    </text>
  </g>
</svg>
